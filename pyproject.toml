[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oracle-plsql-mcp"
version = "0.1.0"
description = "Read-only Oracle metadata and PL/SQL analysis MCP server"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=2.0",
    "oracledb>=2.5",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
oracle-plsql-mcp = "oracle_plsql_mcp.server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]
